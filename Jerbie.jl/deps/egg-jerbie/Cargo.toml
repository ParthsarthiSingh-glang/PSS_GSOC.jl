[package]
name = "egg-jerbie"
version = "0.1.0"
edition = "2021"

[lib]
name = "jerbie"
crate-type = ["cdylib"]

[dependencies]
egg = { version = "0.11"}
num-rational = "0.4"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
log = "0.4"
rival3 = { git = "https://github.com/herbie-fp/rival3.git", rev = "58cb38e2cbad842a024fe9ef47cd581618ca20f2" }
rug = { version = "1.28", features = ["float"] }
gmp-mpfr-sys = { version = "1.7", features = ["force-cross"] }
rand = "0.9"

# Patched: use-system-libs' system-lib detection normally compiles AND
# executes a test binary, which fails when cross-compiling (can't run a
# Darwin binary on the Linux BB sandbox). Everything it needs is actually
# just preprocessor macros from gmp.h/mpfr.h, so the patch replaces
# compile+execute with preprocess-only (-E -dM). See
# deps/gmp-mpfr-sys-patched/build.rs for the change.
[patch.crates-io]
gmp-mpfr-sys = { path = "../gmp-mpfr-sys-patched" }

